<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Callback</title>
    <script>
        window.onload = function() {
            // Extract the access token from the URL fragment
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get("access_token");
            const error = params.get("error");
            
            if (error) {
                // Handle error case
                document.body.innerHTML = `<h1>Authorization Error: ${error}</h1>
                                          <p>${params.get("error_description") || ''}</p>
                                          <a href="/genesysContactCenter/login">Return to Login</a>`;
                return;
            }
            
            if (accessToken) {
                // redirect to the server side handler with the access token
                const targetUrl = `/genesysContactCenter/callbackServer?access_token=${encodeURIComponent(accessToken)}`;
                window.location.replace(targetUrl);
            } else {
                // handle error if token is not present
                document.body.innerHTML = "<h1>Authorization failed: No access token received</h1>" +
                                          "<a href='/genesysContactCenter/login'>Return to Login</a>";
            }
        };
    </script>
</head>
<body>
    <h1>Processing Authorization...</h1>
</body>
</html>
